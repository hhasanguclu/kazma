name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload assets to, e.g. v0.1.0"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Smoke test
        run: |
          target/release/kz.exe --version
          target/release/kz.exe clean --dry-run
          target/release/kz.exe purge --dry-run "$env:GITHUB_WORKSPACE"
          target/release/kz.exe drivers --installed
          target/release/kz.exe upgrade --dry-run
          target/release/kz.exe installer --dry-run
          target/release/kz.exe uninstall --dry-run
          target/release/kz.exe optimize --dry-run
          target/release/kz.exe whitelist
      - name: Smoke test (Windows Update driver search)
        continue-on-error: true
        timeout-minutes: 10
        run: target/release/kz.exe drivers --dry-run
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/kz.exe dist/
          Compress-Archive -Path target/release/kz.exe, README.md, LICENSE -DestinationPath dist/kazma-windows-x64.zip
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kazma-windows-x64
          path: dist/*
      # A push to main whose Cargo.toml version has no tag yet creates that
      # release automatically: bump the version, push, done.
      - name: Detect new version
        id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $exists = git ls-remote --tags origin "refs/tags/v$v"
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "new=$(if ($exists) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' || steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || steps.ver.outputs.tag || github.ref_name }}
          name: kazma ${{ inputs.tag || steps.ver.outputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: dist/*
