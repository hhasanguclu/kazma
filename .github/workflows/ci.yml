name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload assets to, e.g. v0.1.0"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Smoke test
        run: |
          target/release/kz.exe --version
          target/release/kz.exe clean --dry-run
          target/release/kz.exe purge --dry-run "$env:GITHUB_WORKSPACE"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/kz.exe dist/
          Compress-Archive -Path target/release/kz.exe, README.md, LICENSE -DestinationPath dist/kazma-windows-x64.zip
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kazma-windows-x64
          path: dist/*
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: kazma ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
