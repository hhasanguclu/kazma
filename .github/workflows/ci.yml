name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build and upload assets to, e.g. v0.2.0"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      # ARM64 (Snapdragon) build; never blocks an x64 release
      - name: Build ARM64
        id: arm64
        continue-on-error: true
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo build --release --target aarch64-pc-windows-msvc

      # Read-only commands run for real on Windows, so every PowerShell script
      # they use is executed (a syntax error fails the build).
      - name: Smoke test
        env:
          KAZMA_NO_OPLOG: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $kz = 'target/release/kz.exe'
          & $kz --version
          foreach ($args_ in @(
            @('clean', '--dry-run'),
            @('purge', '--dry-run', $env:GITHUB_WORKSPACE),
            @('installer', '--dry-run'),
            @('dupes', '--dry-run', $env:GITHUB_WORKSPACE),
            @('drivers', '--installed'),
            @('upgrade', '--dry-run'),
            @('uninstall', '--dry-run'),
            @('optimize', '--dry-run'),
            @('startup', '--list'),
            @('health'),
            @('debloat', '--dry-run'),
            @('privacy', '--dry-run'),
            @('schedule', 'status'),
            @('whitelist'),
            @('config'),
            @('rules'),
            @('empty', '--dry-run', $env:GITHUB_WORKSPACE),
            @('ports'),
            @('ports', '443'),
            @('power'),
            @('backup', '--dry-run'),
            @('report', '--no-open', '--output', "$env:RUNNER_TEMP\kazma-report.html"),
            @('context', 'install'),
            @('context', 'status'),
            @('context', 'uninstall'),
            @('bench', $env:RUNNER_TEMP, '--size-mb', '64'),
            @('uninstall', '--leftovers'),
            @('lock', "$env:GITHUB_WORKSPACE\Cargo.toml")
          )) {
            Write-Host "== kz $($args_ -join ' ')"
            & $kz @args_
            if ($LASTEXITCODE -ne 0) { throw "kz $($args_ -join ' ') failed with $LASTEXITCODE" }
          }
          $env:KAZMA_LANG = 'tr'
          & $kz health
          if ($LASTEXITCODE -ne 0) { throw "kz health (tr) failed" }
          if (-not (Test-Path "$env:RUNNER_TEMP\kazma-report.html")) { throw "report was not written" }
      # The raw MFT reader must agree byte-for-byte with a normal directory walk.
      - name: MFT self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'mft-test'
          New-Item -ItemType Directory -Force "$root\a\b\c", "$root\Türkçe klasör", "$root\many" | Out-Null
          [IO.File]::WriteAllBytes("$root\tiny.txt", [byte[]]::new(300))
          [IO.File]::WriteAllBytes("$root\a\big.bin", [byte[]]::new(5MB))
          [IO.File]::WriteAllBytes("$root\a\b\c\deep.mp4", [byte[]]::new(123457))
          [IO.File]::WriteAllBytes("$root\Türkçe klasör\belge.pdf", [byte[]]::new(77777))
          1..3000 | ForEach-Object { [IO.File]::WriteAllBytes("$root\many\f$_.log", [byte[]]::new($_ % 2000)) }
          fsutil file createnew "$root\sparse.img" 50000000 | Out-Null
          Write-VolumeCache -DriveLetter ($root.Substring(0,1))
          target/release/kz.exe types $root --verify
          if ($LASTEXITCODE -ne 0) { throw "MFT scan disagrees with the directory walk" }
          Measure-Command { target/release/kz.exe types C:\Windows --method mft } | Select-Object -ExpandProperty TotalSeconds | ForEach-Object { "MFT scan of C:\Windows: $_ s" }
          target/release/kz.exe types C:\Windows --method mft
      # Restart Manager must name the process that holds a file open
      - name: Lock finder self-test
        continue-on-error: true
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'held.txt'
          Set-Content $f 'x'
          $p = Start-Process pwsh -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', "`$h = [IO.File]::Open('$f', 'Open', 'Read', 'None'); Start-Sleep 60"
          Start-Sleep 5
          $out = target/release/kz.exe lock $f | Out-String
          Write-Host $out
          Stop-Process -Id $p.Id -Force
          if ($out -notmatch "$($p.Id)") { throw "kz lock did not name the holder (pid $($p.Id))" }
      - name: Smoke test (deepclean, repair)
        run: |
          target/release/kz.exe deepclean --dry-run
          target/release/kz.exe repair --dry-run
          target/release/kz.exe power
      # Network-dependent checks: informative, never block a release.
      - name: Smoke test (Windows Update driver search)
        continue-on-error: true
        timeout-minutes: 10
        run: target/release/kz.exe drivers --dry-run
      - name: Smoke test (network and System Restore)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          target/release/kz.exe net
          target/release/kz.exe net dns
          target/release/kz.exe restore list
      - name: Smoke test (self-update check)
        continue-on-error: true
        timeout-minutes: 3
        run: target/release/kz.exe update --check

      # Decide whether this run publishes a release:
      # a pushed v* tag, a manual run with a tag, or a push to main whose
      # Cargo.toml version has no tag yet (bump version + push = release).
      - name: Release decision
        id: rel
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = ''
          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) { $tag = '${{ github.ref_name }}' }
          elseif ('${{ inputs.tag }}' -ne '') { $tag = '${{ inputs.tag }}' }
          elseif ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main') {
            if (-not (git ls-remote --tags origin "refs/tags/v$v")) { $tag = "v$v" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$(if ($tag) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v tag=$tag"

      - name: Stage exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/kz.exe dist/
          if (Test-Path target/aarch64-pc-windows-msvc/release/kz.exe) {
            Copy-Item target/aarch64-pc-windows-msvc/release/kz.exe dist/kz-arm64.exe
          }
      - name: Upload unsigned exe
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: kz-unsigned
          path: dist/kz.exe

      # Optional code signing through SignPath (free for open source).
      # Runs only after the repository variables/secrets in docs/SIGNING.md are set.
      - name: Sign with SignPath
        id: sign
        if: steps.rel.outputs.publish == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'kazma' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use signed exe
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter kz.exe | Select-Object -First 1
          Copy-Item $signed.FullName dist/kz.exe -Force

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/kz.exe, README.md, LICENSE -DestinationPath dist/kazma-windows-x64.zip
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kazma-windows-x64
          path: dist/*

      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: kazma ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: dist/*

      # Keep the Scoop bucket and winget manifests in this repo pointing at the
      # new release (the commit made with GITHUB_TOKEN does not trigger CI again).
      - name: Update package manifests
        if: steps.rel.outputs.publish == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/kz.exe -Algorithm SHA256).Hash.ToLower()
          $arm = ''
          if (Test-Path dist/kz-arm64.exe) { $arm = (Get-FileHash dist/kz-arm64.exe -Algorithm SHA256).Hash.ToLower() }
          python packaging/update_manifests.py "${{ steps.rel.outputs.version }}" $hash $arm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket packaging
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update Scoop and winget manifests for v${{ steps.rel.outputs.version }}"
            git push origin HEAD:main
          }
