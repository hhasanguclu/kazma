name: pages
# Publishes site/ (plus the README screenshots) to https://hhasanguclu.github.io/kazma/
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "docs/media/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add screenshots and the demo video
        run: |
          mkdir -p site/screenshots
          cp docs/screenshots/*.png site/screenshots/
          mkdir -p site/media
          cp docs/media/kazma-promo.mp4 docs/media/kazma-promo-poster.jpg site/media/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
