name: release notes
# Refresh the text of an existing release from RELEASE_NOTES.md without
# rebuilding or re-uploading its files (their checksums stay as published).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: kazma ${{ inputs.tag }}
          body_path: RELEASE_NOTES.md
