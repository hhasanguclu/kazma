[package]
name = "kazma"
version = "0.4.0"
edition = "2024"
description = "Oldschool ASCII system cleaner & disk explorer for Windows"
license = "MIT"
repository = "https://github.com/hhasanguclu/kazma"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
trash = "5.3.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_Globalization"] }

[[bin]]
name = "kz"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
