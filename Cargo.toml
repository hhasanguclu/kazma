[package]
name = "kazma"
version = "0.1.0"
edition = "2024"
description = "Oldschool ASCII system cleaner & disk explorer for Windows"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rayon = "1.12.0"
sysinfo = "0.40.1"
trash = "5.3.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[[bin]]
name = "kz"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
