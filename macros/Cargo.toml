[package]
name = "kazma-macros"
version = "1.0.0"
edition = "2024"
description = "tr! macro for kazma: compile-time checked strings with runtime translations"
license = "MIT"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
